name: 'meteor-dockerfile'
description: 'Generate multistage Meteor Dockerfile'
inputs:
  meteor-version:
    description: 'Meteor Version'
    required: false
    default: ''
  meteor-release-file:
    description: 'Path to .meteor/release'
    required: false
    default: './.meteor/release'
  docker-file:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  node-patch-image:
    description: 'Image providing a patched node binary at /node, e.g. registry.example.com/org/node:{node}-alpine-patched. {node} is replaced by the resolved Node version. Empty = no patch.'
    required: false
    default: ''
branding:
  icon: package
  color: blue
runs:
  using: 'node24'
  main: 'dist/index.js'