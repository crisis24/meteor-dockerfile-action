name: 'meteor-dockerfile'
description: 'Generate multistage Meteor Dockerfile'
inputs:
  meteor-version:
    description: 'Meteor Version'
    required: false
    default: ''
  meteor-release-file:
    description: 'Path to .meteor/release'
    required: false
    default: './.meteor/release'
  docker-file:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  node-patch-image:
    description: 'Image providing a patched node binary at /node, e.g. registry.example.com/org/node:{node}-alpine-patched. {node} is replaced by the resolved Node version. Empty = no patch.'
    required: false
    default: ''
  ca-cert:
    description: 'Path, relative to the Docker build context, of a PEM file with extra CA certificates to trust. It is copied into the runtime image and exposed to Node.js through NODE_EXTRA_CA_CERTS. Empty = none.'
    required: false
    default: ''
  context:
    description: 'Docker build context directory, relative to the workspace. Used to resolve and validate ca-cert; must match the context of the docker build.'
    required: false
    default: '.'
branding:
  icon: package
  color: blue
runs:
  using: 'node24'
  main: 'dist/index.js'